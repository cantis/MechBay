<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('miniatures.list_miniatures') }}">MechBay</a>
        {% if document_status is defined %}
        {% set inv_label = document_status.inventory_label | default('Untitled') %}
        <span class="navbar-text small text-truncate d-lg-none ms-auto me-2{% if document_status.inventory_dirty %} fw-semibold text-warning-emphasis{% else %} text-body-secondary{% endif %}"
            style="max-width: 9rem" title="{{ inv_label }}">{{ inv_label }}</span>
        {% endif %}
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                        aria-expanded="false">File</a>
                    <ul class="dropdown-menu">
                        <li>
                            <button type="button" class="dropdown-item"
                                onclick="MechBayFiles.newInventory()">New inventory</button>
                        </li>
                        <li>
                            <button type="button" class="dropdown-item"
                                onclick="MechBayFiles.openInventory()">Open inventory…</button>
                        </li>
                        <li>
                            <label class="dropdown-item mb-0" style="cursor:pointer">
                                Open inventory (upload)…
                                <input type="file" accept=".mechbay,.json,application/json" class="d-none"
                                    onchange="MechBayFiles.openInventoryUpload(this)">
                            </label>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <button type="button" class="dropdown-item"
                                {% if not document_status.inventory_path %}disabled aria-disabled="true"{% endif %}
                                onclick="MechBayFiles.saveInventory()">Save inventory</button>
                        </li>
                        <li>
                            <button type="button" class="dropdown-item"
                                onclick="MechBayFiles.saveInventoryAs()">Save inventory as…</button>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <button type="button" class="dropdown-item"
                                onclick="MechBayFiles.openForce()">Open force…</button>
                        </li>
                        <li>
                            <label class="dropdown-item mb-0" style="cursor:pointer">
                                Open force (upload)…
                                <input type="file" accept=".mbforce,.json,application/json" class="d-none"
                                    onchange="MechBayFiles.openForceUpload(this)">
                            </label>
                        </li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('miniatures.list_miniatures') }}">Inventory</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('forces.list_forces') }}">Forces</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('lance_templates.list_templates') }}">Lance Templates</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('about') }}">About</a>
                </li>
            </ul>
            {% if document_status is defined %}
            <div class="navbar-text small text-end ms-lg-2 d-none d-lg-block">
                <span class="text-muted">Inventory:</span>
                <span class="text-truncate d-inline-block align-bottom{% if document_status.inventory_dirty %} fw-semibold text-warning-emphasis border-bottom border-warning border-2{% else %} text-body-secondary{% endif %}"
                    style="max-width: 14rem" title="{{ inv_label }}">{{ inv_label }}</span>
            </div>
            {% endif %}
        </div>
    </div>
</nav>
