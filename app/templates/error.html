{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body text-center py-5">
                    <div class="mb-4">
                        <i class="fa-solid {{ icon }} text-{{ color }} fa-3x"></i>
                    </div>
                    <h1 class="display-4 fw-bold">{{ code }}</h1>
                    <p class="lead text-muted mb-4">{{ title }}</p>
                    <p class="mb-4">{{ message }}</p>
                    <a href="{{ url_for('miniatures.list_miniatures') }}" class="btn btn-primary">
                        <i class="fa-solid fa-house me-1"></i> Back to Inventory
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
